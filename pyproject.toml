[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dpx-mojo"
version = "0.1.0"
description = "🎯 Modern Mojo Static Analyzer: SIMD Vectorization, Ownership, Memory Safety, GoF 23 & AI Hardware Acceleration Architectural Pattern Detector"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Bivex Team", email = "dev@bivex.io" }
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
dpx-mojo = "pattern_detector.adapters.inbound.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pattern_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=src/pattern_detector --cov-report=term-missing"
